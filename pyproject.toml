[project]
name = "mcap-toolkit"
version = "0.1.0"
description = "CLC-MBE MCAP viewer and exporter (images, plots, playback)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.4.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.24.0",
    "mcap>=1.3.1",
    "mcap-protobuf-support>=0.5.4",
    "foxglove-schemas-protobuf>=0.3.0",
    "protobuf>=4.0.0",
    "opencv-python>=4.5.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mcap-toolkit = "mcap_toolkit.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcap_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcap_toolkit/resources/app.ico" = "mcap_toolkit/resources/app.ico"
"src/mcap_toolkit/resources/app.png" = "mcap_toolkit/resources/app.png"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
